function spd(){if(!V('pn').trim())return toast('Ürün adı gerekli');if(!D.cats.length)return toast('Önce kategori ekleyin');const o={id:ED||'p'+Date.now(),n:V('pn').trim(),p:V('pp'),cat:V('pc'),stock:V('ps')===''?'':+V('ps'),vid:V('pv').trim(),d:V('pd'),imgs:[...TI],out:$('#po').checked,feat:$('#pf').checked,hide:$('#ph').checked},i=D.prods.findIndex(x=>x.id==ED);i>=0?D.prods[i]=o:D.prods.unshift(o);ED=null;TI=[];save();A()}

function tsl(){return `<div class="box"><h3>Kampanya / Slider Görselleri</h3><p style="color:var(--mut)">Önerilen oran 16:7 (örn. 1600×700). Birden fazla seçebilirsiniz. Hiç görsel eklenmezse varsayılan doğa görselleri gösterilir.</p><input type="file" accept="image/*" multiple onchange="many(this,d=>{D.slides.push(d);save();A()},1600)"></div><div class="box"><h3>Yüklenenler (${D.slides.length})</h3>${D.slides.map((x,i)=>`<div class="li"><img src="${x}" style="width:110px;height:50px"><span>Görsel ${i+1}</span><div class="ac"><button class="b s g" onclick="mv(D.slides,${i},-1)">↑</button><button class="b s g" onclick="mv(D.slides,${i},1)">↓</button><button class="b s r" onclick="dl(this,()=>{D.slides.splice(${i},1);save();A()})">Sil</button></div></div>`).join('')||'<p>Henüz görsel yok.</p>'}</div>`}
function ad(){const n=V('dn').trim();if(!n)return toast('Bayi adı gerekli');const f=$('#di').files[0],add=i=>{D.dealers.push({n,img:i});save();A()};f?rd(f,add,300):add('')}
